name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend deps
        run: cd backend && pip install -e .[dev] && pip install argon2-cffi PyJWT httpx
      - name: Backend tests
        run: cd backend && python -m pytest -v


name: Keep API awake

# Render free web services spin down after ~15 minutes without traffic, which
# makes the next request wait for a cold start. This workflow sends a light
# request to the API health endpoint on a schedule so the instance stays warm.
#
# Only `restaurent` (the Python web service) can sleep. `rest-1` and
# `restaurant-sadmin` are static sites served from Render's CDN and never
# spin down, so they are intentionally not pinged here.
#
# Notes:
# * GitHub's cron granularity is 5 minutes and scheduled runs can be delayed
#   when the runner pool is busy. 5 minutes keeps a safe margin below Render's
#   ~15 minute idle window even with a few minutes of scheduler lag.
# * Scheduled workflows are disabled after 60 days without repository
#   activity; any push re-enables them.
# * Override the target without editing this file by setting the repository
#   variable API_HEALTH_URL (Settings -> Secrets and variables -> Actions ->
#   Variables).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API health endpoint
        env:
          HEALTH_URL: ${{ vars.API_HEALTH_URL || 'https://restaurent-rf9c.onrender.com/health' }}
        run: |
          set -euo pipefail
          echo "Pinging $HEALTH_URL"
          start=$(date +%s)
          status=$(curl \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --max-time 120 \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            "$HEALTH_URL")
          elapsed=$(( $(date +%s) - start ))
          echo "HTTP $status in ${elapsed}s"
          if [ "$status" != "200" ]; then
            echo "::error::Health check returned HTTP $status from $HEALTH_URL"
            exit 1
          fi

# Render deployment configuration for restaurant management system
# Deploy on https://dashboard.render.com

services:
  # Frontend (React/Vite)
  - type: web
    name: restaurant-frontend
    env: node
    plan: free
    buildCommand: "cd apps/web && npm ci && npm run build"
    startCommand: "cd apps/web && npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: REACT_APP_API_URL
        value: https://api.restaurant-system.com
    healthCheck:
      path: /
    domain:
      - restaurant-system.com
    autoDeploy: true

  # Backend (FastAPI)
  - type: web
    name: restaurant-backend
    env: python
    plan: free
    buildCommand: "cd backend && pip install --no-cache-dir -r requirements.txt"
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    envVars:
      - key: DATABASE_URL
        value: postgresql://postgres:tara@postgres:5432/restaurant
      - key: REDIS_URL
        value: redis://redis:6379
      - key: SECRET_KEY
        value: ${SECRET_KEY}
      - key: ALLOWED_HOSTS
        value: restaurant-system.com,localhost
    healthCheck:
      path: /health
    domain:
      - api.restaurant-system.com
    autoDeploy: true
    conditions:
      - deployment->backend

  # Redis (for session storage and caching)
  - type: worker
    name: restaurant-redis
    env: redis
    plan: free
    autoDeploy: true
    volume:
      - source: redis_data
        target: /data

  # PostgreSQL Database
  - type: web
    name: restaurant-database
    env: postgresql
    plan: free
    autoDeploy: true
    volume:
      - source: postgres_data
        target: /var/lib/postgresql/data

# Mounts for persistent data
mounts:
  - name: redis_data
    source: redis_volume
    mountPath: /data

  - name: postgres_data
    source: postgres_volume
    mountPath: /var/lib/postgresql/data

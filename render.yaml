# Render Blueprint — reference configuration for the restaurant platform.
#
# IMPORTANT: the live services below were created through the Render Dashboard
# and are NOT currently managed by a Blueprint. This file documents their real
# settings so the infrastructure is reproducible. Applying it as a Blueprint
# would try to create a second copy of every service (and the free plan allows
# only one free Postgres), so read it as documentation unless you are migrating.
#
# Live resources (workspace lets_go / tea-d5h19p4hg0os73fltel0):
#   backend API        restaurent          srv-dbr0qu8ae00c73bhoqu0  https://restaurent-rf9c.onrender.com
#   customer + staff   rest-1              srv-dbquo915efls73ftjipg  https://rest-1-t4ux.onrender.com
#   super admin        restaurant-sadmin   srv-dbr8hvec6qcc73d5m7r0  https://restaurant-sadmin.onrender.com
#   Postgres           restaurent          dpg-dbqqppbrjlhs73a695vg-a (free, oregon, expires 2026-12-12)
#
# Secrets are never stored here: every sensitive key uses `sync: false`, which
# means "set this in the Render Dashboard". Values live only on Render.

services:
  # ── Backend API (FastAPI + Alembic) ───────────────────────────────────────
  - type: web
    name: restaurent
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install --no-cache-dir -r backend/requirements.txt
    # Alembic runs on every boot; the app then refuses to start unless the
    # database revision matches the code's head revision.
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Injected by Render from the Postgres instance (internal address).
      - key: DATABASE_URL
        sync: false
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_MINUTES
        value: 480

      # Browser origins allowed to call the API.
      - key: CORS_ORIGINS
        value: https://rest-1-t4ux.onrender.com,https://restaurant-sadmin.onrender.com

      # Super-admin realm. PLATFORM_SECRET_KEY must differ from SECRET_KEY and
      # be at least 32 characters; PLATFORM_COOKIE_DOMAIN must stay empty.
      - key: PLATFORM_SECRET_KEY
        sync: false
      - key: PLATFORM_MFA_KEY
        sync: false
      - key: PLATFORM_ADMIN_ORIGIN
        value: https://restaurant-sadmin.onrender.com
      - key: PLATFORM_API_ORIGIN
        value: https://restaurent-rf9c.onrender.com
      - key: PLATFORM_TENANT_ORIGIN
        value: https://rest-1-t4ux.onrender.com
      - key: PLATFORM_COOKIE_SECURE
        value: "true"
      - key: PLATFORM_COOKIE_DOMAIN
        value: ""
      - key: PLATFORM_REQUIRE_MFA
        value: "true"
      - key: PLATFORM_BOOTSTRAP_EMAIL
        sync: false
      - key: PLATFORM_BOOTSTRAP_PASSWORD
        sync: false

      # Invitation emails link to the app that hosts /auth/invitations/:token.
      - key: INVITATION_BASE_URL
        value: https://rest-1-t4ux.onrender.com
      - key: INVITATION_TTL_HOURS
        value: "72"
      - key: EMAIL_BACKEND
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_STARTTLS
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

      # Customer QR surface: the shared host that may serve table codes.
      - key: CUSTOMER_QR_DOMAIN
        value: rest-1-t4ux.onrender.com
      - key: QR_HOSTNAME_ENFORCEMENT
        value: "true"

      # Image uploads.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Push notifications (disabled unless a worker is deployed).
      - key: FCM_WORKER_ENABLED
        value: "false"

  # ── Customer QR menu + staff/owner console (Vite build: dist) ────────────
  - type: web
    name: rest-1
    runtime: static
    branch: main
    autoDeployTrigger: commit
    buildCommand: cd apps/web && npm ci && npm run build
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://restaurent-rf9c.onrender.com
      - key: VITE_PLATFORM_API_URL
        value: https://restaurent-rf9c.onrender.com
      - key: VITE_PLATFORM_ENV
        value: production
      - key: VITE_DEMO_ACCOUNTS
        value: "0"
      - key: VITE_CUSTOMER_QR_DOMAIN
        value: rest-1-t4ux.onrender.com
    routes:
      # React Router: every unknown path renders the SPA shell.
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Super Admin console (Vite build: dist-admin, entry admin.html) ───────
  - type: web
    name: restaurant-sadmin
    runtime: static
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build:admin
    rootDir: apps/web
    staticPublishPath: dist-admin
    envVars:
      - key: VITE_PLATFORM_API_URL
        value: https://restaurent-rf9c.onrender.com
      - key: VITE_PLATFORM_ENV
        value: production
      - key: VITE_DEMO_ACCOUNTS
        value: "0"
    routes:
      - type: rewrite
        source: /*
        destination: /admin.html

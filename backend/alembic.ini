# Alembic configuration for the restaurant backend.
#
# The database URL always comes from application settings
# (app/core/config.py -> settings.database_url, via DATABASE_URL env var),
# never from this file. See alembic/env.py.
#
# All schema changes go through revisions in alembic/versions/.
# app.main runs `alembic upgrade head` on startup; do NOT reintroduce
# Base.metadata.create_all as a production migration mechanism.

[alembic]
script_location = alembic
prepend_sys_path = .

# Placeholder only; overridden by env.py with the configured database URL.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

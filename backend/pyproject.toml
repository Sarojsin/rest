[project]
name = "restaurant-backend"
version = "0.1.0"
description = "FastAPI backend for the restaurant management system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23.0",
  "PyJWT>=2.9",
  "email-validator>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerated revisions are historical code: never rewrite them
# retroactively with newer style rules, or replayed migrations break.
"backend/alembic/versions/*" = ["E501", "I001", "UP007", "UP035", "E402"]
"alembic/versions/*" = ["E501", "I001", "UP007", "UP035", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

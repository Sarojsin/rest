[project]
name = "restaurant-backend"
version = "0.1.0"
description = "FastAPI backend for the restaurant management system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23.0",
  "PyJWT>=2.9",
  "email-validator>=2.0",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerated revisions are historical code: never rewrite them
# retroactively with newer style rules, or replayed migrations break.
"backend/alembic/versions/*" = ["E501", "I001", "UP007", "UP035", "E402"]
"alembic/versions/*" = ["E501", "I001", "UP007", "UP035", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.importlinter]
root_package = "app"
include_external_packages = false

# (plan 02 §2.1, 21 §10.2) Layering: shared kernel beneath modules; modules
# may never import app.api (api composes modules, not the reverse) — the
# router files inside modules are the only sanctioned composition touchpoints.
[[tool.importlinter.contracts]]
name = "shared kernel has zero domain logic (no module imports from modules)"
type = "forbidden"
source_modules = ["app.shared"]
forbidden_modules = ["app.modules", "app.api"]

[[tool.importlinter.contracts]]
name = "api is a composition layer; only module routers may touch app.api"
type = "forbidden"
source_modules = ["app.modules"]
forbidden_modules = ["app.api"]
ignore_imports = [
    "app.modules.identity.router -> app.api.deps",
    "app.modules.tenancy.router -> app.api.deps",
    "app.modules.catalog.router -> app.api.deps",
    "app.modules.operations.router_orders -> app.api.deps",
    "app.modules.operations.router_tables -> app.api.deps",
    "app.modules.billing.router -> app.api.deps",
    "app.modules.payments.router -> app.api.deps",
    "app.modules.kitchen.router -> app.api.deps",
    "app.modules.service_calls.router -> app.api.deps",
    "app.modules.reports.router -> app.api.deps",
]

# workers contract: see below.

[[tool.importlinter.contracts]]
name = "workers scheduler touches modules only through public service interfaces"
type = "forbidden"
source_modules = ["app.workers"]
forbidden_modules = [
    "app.modules.audit.models",
    "app.modules.billing.models",
    "app.modules.catalog.models",
    "app.modules.identity.models",
    "app.modules.kitchen.models",
    "app.modules.notifications.models",
    "app.modules.operations.models",
    "app.modules.payments.models",
    "app.modules.reports.models",
    "app.modules.service_calls.models",
    "app.modules.tenancy.models",
]

# NOTE on cross-module edges: the frozen Phase 0 inventory of pre-existing
